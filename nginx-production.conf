# Production Nginx Configuration for https://sshdesktop.com
# Drop into /etc/nginx/sites-available/sshdesktop.com and symlink to sites-enabled

# 1. Redirect HTTP to HTTPS & non-www to canonical
server {
    listen 80;
    listen [::]:80;
    server_name sshdesktop.com www.sshdesktop.com;
    return 301 https://sshdesktop.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sshdesktop.com;

    # SSL Certs (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/sshdesktop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sshdesktop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://sshdesktop.com$request_uri;
}

# 2. Main Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sshdesktop.com;

    root /var/www/sshdesktop;
    index index.html;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/sshdesktop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sshdesktop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # High-Performance Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 301 Redirect for legacy docs.html to canonical /docs/
    location = /docs.html {
        return 301 https://sshdesktop.com/docs/;
    }

    # Custom 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Static Assets Long-term Cache (1 Year)
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML files - revalidate
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # Root location routing
    location / {
        try_files $uri $uri/ =404;
    }
}
